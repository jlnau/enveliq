# Enveliq: install file that BUILDS the images on your own computer (for Raspberry Pi and other ARM computers).
# Use docker-compose.yml in this folder instead if you have an ordinary 64-bit Intel or AMD computer: it is quicker.
#
# You only need to change the lines marked  <-- CHANGE THIS  (only the vault key is required). Everything else can stay as it is.
# Step-by-step instructions for your kind of computer: https://github.com/jlnau/enveliq/blob/main/docs/install/README.md
#
# Two small programs run together:
#   enveliq         the app itself
#   enveliq-render  draws PDF attachments as pictures. It has no internet and cannot see your data.

name: enveliq

services:
  enveliq:
    build: ..
    image: enveliq:local
    container_name: enveliq
    restart: unless-stopped
    environment:
      # These values come from a file named .env next to this one (or from your control panel's "environment" box).
      # The ONLY thing you must set is the vault key. Everything else already has a safe default.
      # 1. The address you type in your browser. Default: only this computer. To open Enveliq from other devices, see docs/install/choose-settings.md.
      ENVELIQ_PUBLIC_URL: "${ENVELIQ_PUBLIC_URL:-http://localhost:8765}"          # <-- CHANGE THIS only to open Enveliq from other devices

      # 2. A one-time setup code. Leave empty: Enveliq makes one itself (see docs/install/README.md for where to read it).
      ENVELIQ_SETUP_CODE: "${ENVELIQ_SETUP_CODE:-}"

      # 3. Only for an address starting http:// on your home network (not localhost): set to 1.
      ENVELIQ_ALLOW_INSECURE_PUBLIC_URL: "${ENVELIQ_ALLOW_INSECURE_PUBLIC_URL:-}"          # <-- CHANGE THIS only for http://192.168... addresses

      # 4. REQUIRED: the vault key. It locks everything Enveliq keeps and unlocks it after every restart. Save a copy in your password manager.
      #    With a .env file: put ENVELIQ_VAULT_KEY=your-key in it. Without one: replace ${ENVELIQ_VAULT_KEY:-} below with your key.
      ENVELIQ_VAULT_KEY: "${ENVELIQ_VAULT_KEY:-}"          # <-- CHANGE THIS (required)

      # Optional (you can ignore these until you want them; the guide explains each):
      # ENVELIQ_LLM_URL: ""        # an AI model on your own network (you can also do this inside the app)

      # Keep this as it is: it connects Enveliq to the PDF drawing program below.
      ENVELIQ_RENDER_URL: http://enveliq-render:8766
    ports:
      # "8765:8765" opens Enveliq to other devices on your network (the address in ENVELIQ_PUBLIC_URL decides who can sign in).
      # To let only this computer open it, use "127.0.0.1:8765:8765" instead. Never forward this port on your router.
      - "8765:8765"
    volumes:
      - enveliq-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [default, render]
    mem_limit: 768m
    pids_limit: 128

  enveliq-render:
    build:
      context: ..
      dockerfile: Dockerfile.render
    image: enveliq-render:local
    container_name: enveliq-render
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [render]
    mem_limit: 1536m
    pids_limit: 64
    cpus: 1.0

networks:
  render:
    name: enveliq-render-net
    internal: true     # no internet, and no other containers

volumes:
  enveliq-data:
    name: enveliq-data     # all your Enveliq data lives here; the guide shows how to back it up
