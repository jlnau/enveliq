# Enveliq with Docker Compose.
#
# 0. REQUIRED: make a vault key and put it in a .env file next to this one:
#      echo "ENVELIQ_VAULT_KEY=$(openssl rand -hex 32)" >> .env
#    Enveliq then unlocks itself after every restart (see docs/VAULT_KEY.md).
#    Keep a copy of that line somewhere safe: without it the data cannot be opened.
# 1. Set ENVELIQ_PUBLIC_URL to the https:// address people will use (your
#    reverse proxy). Passkeys and single sign-on only work on that address.
# 2. docker compose up -d --build     (builds and starts both containers: Enveliq and its PDF viewer)
# 3. docker compose exec enveliq cat /data/setup-code.txt
# 4. Open the public URL and finish setup.
services:
  enveliq:
    build: .
    image: enveliq:local
    container_name: enveliq
    restart: unless-stopped
    environment:
      ENVELIQ_PUBLIC_URL: ${ENVELIQ_PUBLIC_URL:-http://localhost:8765}
      # Only for opening Enveliq over plain http on your own network (docs/NETWORK_ACCESS.md).
      ENVELIQ_ALLOW_INSECURE_PUBLIC_URL: ${ENVELIQ_ALLOW_INSECURE_PUBLIC_URL:-}
      # Optional: choose the first-run setup code instead of reading it from the file.
      # ENVELIQ_SETUP_CODE: ${ENVELIQ_SETUP_CODE}
      # Proton Bridge: trust only this certificate, and contact only this host.
      ENVELIQ_BRIDGE_CA_FILE: /etc/enveliq/proton-bridge.crt
      ENVELIQ_BRIDGE_ALLOWED_HOSTS: ${ENVELIQ_BRIDGE_HOST:-172.30.0.1}
      # Optional AI summaries from a model you run yourself (OpenAI-style chat endpoint on your network).
      # Leave ENVELIQ_LLM_URL empty to switch AI off. Each mailbox must also be switched on by its owner.
      ENVELIQ_LLM_URL: ${ENVELIQ_LLM_URL:-}
      ENVELIQ_LLM_MODEL: ${ENVELIQ_LLM_MODEL:-}
      ENVELIQ_LLM_API_KEY: ${ENVELIQ_LLM_API_KEY:-}
      # Only for a cloud service set here instead of in the app: its id (openai, anthropic, gemini, openrouter, groq, mistral, xai, deepseek, together).
      ENVELIQ_LLM_PROVIDER: ${ENVELIQ_LLM_PROVIDER:-}
      # REQUIRED for a new install: the vault key that locks everything and unlocks it after every restart (see docs/VAULT_KEY.md).
      ENVELIQ_VAULT_KEY: ${ENVELIQ_VAULT_KEY:-}
      # The PDF viewer container below (private network, no internet). Remove this line to turn PDF viewing off.
      ENVELIQ_RENDER_URL: http://enveliq-render:8766
      # Reminders, calendars and To-do lists may call services on your own network (ntfy, Gotify, Home Assistant, Nextcloud)
      # only if listed here, e.g. 192.168.1.0/24,homeassistant.local. An administrator can also do this in the app.
      ENVELIQ_NOTIFY_ALLOWED_HOSTS: ${ENVELIQ_NOTIFY_ALLOWED_HOSTS:-}
      # Stronger option: keep the key in a file outside the data volume (see docs/VAULT_KEY.md).
      # ENVELIQ_VAULT_KEY_FILE: /keys/vault.key
    ports:
      # Loopback only unless you choose otherwise: your reverse proxy (Caddy, Traefik,
      # Nginx Proxy Manager) on this host terminates HTTPS and forwards here.
      # To open Enveliq on your network without a proxy, set ENVELIQ_PUBLISH=0.0.0.0
      # and the two settings beside it in .env (see docs/NETWORK_ACCESS.md).
      - "${ENVELIQ_PUBLISH:-127.0.0.1}:8765:8765"
    volumes:
      - enveliq-data:/data
      # - ${ENVELIQ_KEY_DIR:-/opt/enveliq/keys}:/keys
      - ${ENVELIQ_BRIDGE_CERT:-/opt/enveliq/proton-bridge.crt}:/etc/enveliq/proton-bridge.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [enveliq, render]
    mem_limit: 768m
    pids_limit: 128

  # Draws PDF pages as pictures so they can be viewed in the page. It reads one PDF at a time from Enveliq over a
  # private network that has no internet and no other containers, cannot see the data folder or any key, and is
  # read-only with every capability dropped. Remove this service (and ENVELIQ_RENDER_URL above) to turn PDF viewing off.
  enveliq-render:
    build:
      context: .
      dockerfile: Dockerfile.render
    image: enveliq-render:local
    container_name: enveliq-render
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [render]
    mem_limit: 1536m
    pids_limit: 64
    cpus: 1.0

networks:
  enveliq:
    name: enveliq
    ipam:
      config:
        # Fixed range so the host-side Bridge forwarders know their address.
        # Change both here and in the forwarder units if this clashes with
        # another Docker network (docker network inspect NAME shows each range).
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

  # Private: containers on it cannot reach the internet or the host.
  render:
    name: enveliq-render-net
    internal: true

volumes:
  enveliq-data:
