        run: node scripts/check_attachment_clip.mjs
      - name: Files listed under an email, with their summaries (made-up mail, no server)
        run: node scripts/check_attachment_summaries.mjs
      - name: AI queue bar at the bottom of the page (made-up mail, no server)
        run: node scripts/check_ai_queue.mjs
      - name: Row buttons on hover (made-up mail, no server)
        run: node scripts/check_hover_actions.mjs
      - name: Version number in the left panel (simulated server)
        run: node scripts/check_version_footer.mjs
      - name: New-version notice (simulated server)
        run: node scripts/check_update_notice.mjs
      - name: The demo (made-up mail, no server)
        run: node scripts/check_demo.mjs
      - name: Important people (simulated server)
        run: node scripts/check_important_people.mjs
      - name: Signature and saved replies (simulated server)
        run: node scripts/check_saved_writing.mjs
      - name: Mail rules (simulated server)
        run: node scripts/check_rules.mjs
      - name: Three-dot menu, Mute, Mark unread, Print and Conversation View (simulated server)
        run: node scripts/check_more_menu.mjs
      - name: Trips page and Home card (simulated server)
        run: node scripts/check_trips.mjs
      - name: Subscriptions page and Home card (simulated server)
        run: node scripts/check_subscriptions.mjs
      - name: Shipping page and Home card (simulated server)
        run: node scripts/check_shipping.mjs
      - name: Refresh keeps your place, Expand all (simulated server)
