      - run: pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      # --with-deps needs administrator rights. On GitHub's machines that is automatic; on your own machine install the libraries once yourself.
      - run: npx playwright install ${{ vars.RUNNER_LABELS == '' && '--with-deps' || '' }} chromium
      - name: Prototype escaping check
        run: node scripts/check_prototype_injection.mjs
      - name: Inbox page with real mail (simulated server)
        run: node scripts/check_inbox_real_mail.mjs
      - name: New email, Sent and pictures (simulated server)
        run: node scripts/check_email_features.mjs
      - name: Phone pop-ups (simulated server)
        run: node scripts/check_phone_overlays.mjs
      - name: No sample flash on refresh (simulated server)
        run: node scripts/check_no_sample_flash.mjs
      - name: Shift to select a range (simulated server)
        run: node scripts/check_shift_select.mjs
      - name: Hermes chat (simulated server)
        run: node scripts/check_agent.mjs
      - name: Unsubscribe button (simulated server)
        run: node scripts/check_unsub.mjs
      - name: Be careful flag (simulated server)
        run: node scripts/check_scam_warning.mjs
      - name: Sender line in View original (simulated server)
        run: node scripts/check_sender_check.mjs
      - name: Links list in View original (simulated server)
        run: node scripts/check_link_check.mjs
      - name: Forward to check in Administration (simulated server)
        run: node scripts/check_check_address.mjs
      - name: Sign in to the Android app through the browser (simulated server)
        run: node scripts/check_app_signin.mjs
      - name: Your devices on the Sign-in and security page (simulated server)
        run: node scripts/check_devices_page.mjs
      - name: Send later (simulated server)
        run: node scripts/check_send_later.mjs
      - name: Writing box, Send arrow and minimise (simulated server)
        run: node scripts/check_formatted_email.mjs
      - name: Snooze (simulated server)
        run: node scripts/check_snooze.mjs
      - name: Search everywhere (simulated server)
        run: node scripts/check_search_everywhere.mjs
      - name: A blank install shows no sample mail (simulated server)
        run: node scripts/check_blank_install.mjs
      - name: The setup page asks for a vault key first (simulated server)
        run: node scripts/check_vault_key_setup.mjs
