        run: node scripts/check_notification_link.mjs

  browser3:
    name: Browser checks (3 of 3)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      # --with-deps needs administrator rights. On GitHub's machines that is automatic; on your own machine install the libraries once yourself.
      - run: npx playwright install ${{ vars.RUNNER_LABELS == '' && '--with-deps' || '' }} chromium
      - name: Sign-in flow (setup, two-factor, passkeys)
        run: scripts/run_signin_e2e.sh
      - name: Mailboxes page against a fake Proton Bridge
        run: python scripts/mailbox_e2e.py
      - name: Setup guide against a fake Bridge and a fake AI model
        run: python scripts/welcome_e2e.py

  # One result called "Browser checks", so a rule that requires that name keeps working now the checks are split in three.
  # It passes when the three parts passed or were skipped because nothing they cover changed.
  browser:
    name: Browser checks
    needs: [browser1, browser2, browser3]
    if: always()
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - name: All three parts passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case "$RESULTS" in *failure*|*cancelled*) exit 1 ;; esac

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Website builds
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --no-package-lock --prefix website
      - run: node website/build.mjs
      - name: Every link and picture resolves, only the search runs a script
        run: node website/check.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      - run: npx playwright install ${{ vars.RUNNER_LABELS == '' && '--with-deps' || '' }} chromium
      - name: Search the guides (browser)
        run: node scripts/check_site_search.mjs
      - name: Website light / dark switch (browser)
        run: node scripts/check_website_theme.mjs

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    name: Docker image
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's own machines are new for every job, but your own runner is not. Clear anything an earlier or cancelled run left behind
      # (a container with the same name stops the next run), and do it again at the end.
      - name: Clear anything left from an earlier run
        run: |
          docker rm -f enveliq-ci enveliq-render-ci >/dev/null 2>&1 || true
          docker network rm enveliq-render-ci-net >/dev/null 2>&1 || true
          docker volume rm enveliq-ci-data >/dev/null 2>&1 || true
      - run: docker build -t enveliq:ci .
      - name: Start hardened container
        run: |
          docker run -d --name enveliq-ci --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -v enveliq-ci-data:/data \
            -e ENVELIQ_PUBLIC_URL=http://localhost:8765 \
            -p 127.0.0.1:8765:8765 enveliq:ci
      - name: Health check and non-root user
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8765/api/v1/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/api/v1/health
          test "$(docker exec enveliq-ci id -u)" = "10001"
      - name: Server log
        if: always()
        run: docker logs enveliq-ci || true
      - name: PDF viewer container (locked down, private network)
        run: |
          docker build -f Dockerfile.render -t enveliq-render:ci .
          docker network create --internal enveliq-render-ci-net
          docker run -d --name enveliq-render-ci --network enveliq-render-ci-net --user 10002:10002 --read-only \
            --cap-drop ALL --security-opt no-new-privileges --memory 1536m --pids-limit 64 enveliq-render:ci
          for i in $(seq 1 40); do
            docker exec enveliq-render-ci python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8766/health',timeout=2)" && break
            sleep 0.5
          done
          # The main image has no PDF parser; it asks the viewer over the private network.
          if docker run --rm --entrypoint sh enveliq:ci -c 'command -v pdftocairo'; then echo "main image must not contain poppler"; exit 1; fi
          docker run --rm --network enveliq-render-ci-net -v "$PWD/tests/sample.pdf:/s.pdf:ro" -e ENVELIQ_RENDER_URL=http://enveliq-render-ci:8766 \
            --entrypoint python enveliq:ci -c "
          import sys
          sys.path.insert(0, '/app')
          from backend.mail import render
          out = render.view(open('/s.pdf','rb').read(), 'trip.pdf', 'application/pdf')
          assert out['kind'] == 'pdf' and out['total'] == 2 and len(out['pages']) == 2, out
          bad = render.view(b'%PDF-1.4 not a real pdf', 'x.pdf', 'application/pdf')
          assert bad['kind'] == 'none', bad
          print('viewer ok')"
          # The viewer cannot reach the internet, and cannot write files or see any data.
          if docker exec enveliq-render-ci python -c "import urllib.request;urllib.request.urlopen('http://1.1.1.1',timeout=4)"; then echo "viewer must have no internet"; exit 1; fi
          test "$(docker exec enveliq-render-ci id -u)" = "10002"
          if docker exec enveliq-render-ci sh -c 'touch /app/x 2>/dev/null'; then echo "viewer must be read-only"; exit 1; fi
      - name: Viewer log
        if: always()
        run: docker logs enveliq-render-ci || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f enveliq-ci enveliq-render-ci >/dev/null 2>&1 || true
          docker network rm enveliq-render-ci-net >/dev/null 2>&1 || true
          docker volume rm enveliq-ci-data >/dev/null 2>&1 || true

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    name: Dependency scan
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Scan pinned dependencies for known vulnerabilities
        run: |
          set +e
          pip-audit --strict -r requirements.txt -f json -o audit.json
          status=$?
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("audit.json")
          data = json.loads(p.read_text()) if p.exists() and p.stat().st_size else {}
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  fix = ", ".join(v.get("fix_versions") or []) or "no fix yet"
                  print(f"::error title={dep['name']} {dep.get('version')}::{v['id']} (fixed in {fix}) {v.get('description', '')[:300]}")
          PY
          exit $status

  # Publishes the two images to GitHub's package store, but only when a GitHub Release is published, and only
  # after every check above has passed on that release's code. Merging pull requests into main runs the checks but
  # publishes nothing, so several merges can go out together as one version.
  # To release: see docs/RELEASING.md. In short: merge a pull request that sets VERSION in backend/version.py, then on
  # GitHub create a release with the tag v<that version> (for example v0.86) and publish it. The tag must match
  # backend/version.py or this job stops.
  # Arcane (or `docker pull`) then fetches the new images; nothing needs building on the server.
  publish:
    name: Publish images
    if: github.event_name == 'release'
    needs: [tests, browser, website, docker, audit]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' backend/version.py)"
          test -n "$version"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "::error::Release tag ${GITHUB_REF_NAME} does not match v${version} in backend/version.py"; exit 1; }
          echo "MAIN=ghcr.io/${owner}/enveliq" >> "$GITHUB_ENV"
          echo "RENDER=ghcr.io/${owner}/enveliq-render" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Sign in to the package store
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push Enveliq
        run: |
          docker build --build-arg "ENVELIQ_PUSH_RELAY=${{ vars.ENVELIQ_PUSH_RELAY }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${MAIN}:latest" -t "${MAIN}:v${VERSION}" -t "${MAIN}:sha-${SHORT}" .
          docker push --all-tags "${MAIN}"
      - name: Build and push the PDF viewer
        run: |
          docker build -f Dockerfile.render --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${RENDER}:latest" -t "${RENDER}:v${VERSION}" -t "${RENDER}:sha-${SHORT}" .
          docker push --all-tags "${RENDER}"
      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo "- \`${MAIN}:latest\` (also \`v${VERSION}\`, \`sha-${SHORT}\`)"
            echo "- \`${RENDER}:latest\` (also \`v${VERSION}\`, \`sha-${SHORT}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
