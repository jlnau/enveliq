# Automated checks for every push and pull request.
# Actions are pinned to full commit hashes; Dependabot proposes updates.
#
# Where the checks run: on GitHub's own machines by default. To use your own machine instead (for example when the
# free minutes run low), add a repository VARIABLE (Settings, Secrets and variables,
# Actions, Variables) named RUNNER_LABELS with the value ["self-hosted","linux","x64"]. Delete the variable to go back.
# On your own machine, install the browser libraries once: sudo npx playwright@1.56.0 install-deps chromium
#
# What runs when: a pull request runs only the checks its changed files can affect (job "Work out what changed").
# A push to main runs the quick set (backend tests, website, Docker image, dependency scan) because the pull request
# already ran everything. The browser checks and everything else run in full on the weekly schedule, on a release and by hand.
# Never leave it set on a public repository: strangers' pull requests could then run code on your machine.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # The full set of checks also runs every Monday morning, on every release, and whenever started by hand.
  schedule:
    - cron: "17 5 * * 1"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Work out what changed
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      browser: ${{ steps.pick.outputs.browser }}
      website: ${{ steps.pick.outputs.website }}
      docker: ${{ steps.pick.outputs.docker }}
      audit: ${{ steps.pick.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -u
          set_all() { for k in backend browser website docker audit; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; }
          case "$EVENT" in
            push)
              # Quick set on main: the pull request already ran the browser checks.
              for k in backend website docker audit; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
              echo "browser=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            *) set_all true; exit 0 ;;
          esac
          files="$(git diff --name-only "$base" HEAD 2>/dev/null)" || { echo "Could not compare; running everything."; set_all true; exit 0; }
          echo "Changed files:"; echo "$files"
          any() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          # Some tests and browser checks read the guides, so a change to docs or the top-level .md files counts for them.
          # Anything outside these folders (workflows, requirements, root files) is treated as touching everything.
          unknown="$(echo "$files" | grep -Ev '^(backend/|tests/|prototype/|web/|scripts/|website/|docs/|[A-Za-z_]+\.md$)' || true)"
          if [ -n "$unknown" ]; then set_all true; exit 0; fi
          echo "backend=$(any '^(backend/|tests/|docs/|[A-Za-z_]+\.md$)')" >> "$GITHUB_OUTPUT"
          echo "browser=$(any '^(backend/|prototype/|web/|scripts/|docs/|[A-Za-z_]+\.md$)')" >> "$GITHUB_OUTPUT"
          echo "website=$(any '^(website/|docs/|prototype/|web/|scripts/check_site|scripts/check_website|[A-Za-z_]+\.md$)')" >> "$GITHUB_OUTPUT"
          echo "docker=$(any '^(backend/|tests/sample\.pdf)')" >> "$GITHUB_OUTPUT"
          echo "audit=false" >> "$GITHUB_OUTPUT"

  tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Runs on every processor; the slowest tests are listed so they are easy to spot.
      - run: python -m pytest -q -n auto --durations=15

  browser1:
    name: Browser checks (1 of 3)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
