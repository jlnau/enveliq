        run: node scripts/check_reply_all_forward.mjs
      - name: Drafts, and the Save as draft question when an email is closed (made-up mail, no server)
        run: node scripts/check_drafts.mjs
      - name: On a phone every email opens full screen, whatever layout is chosen (made-up mail, no server)
        run: node scripts/check_phone_reader.mjs
      - name: View original email shows the email as the sender formatted it, safely (made-up mail, real cleaner)
        run: node scripts/check_original_html.mjs
      - name: The View button on an attachment opens that file in its own viewer (made-up mail, no server)
        run: node scripts/check_attachment_view.mjs
      - name: The Back button returns to the previous section inside the app (made-up mail, no server)
        run: node scripts/check_back_button.mjs
      - name: A Task button on every email adds a task of your own (made-up mail, no server)
        run: node scripts/check_task_add.mjs
      - name: News feeds, the badge at the top and the pop-up, on desktop and phone (made-up feeds, no server)
        run: node scripts/check_rss.mjs
      - name: Tags from the mail service, the Tags button, pop-up and filter, on desktop and phone (made-up mail, no server)
        run: node scripts/check_tags.mjs
      - name: The notification bell, its drop-down and the key for Home Assistant, on desktop and phone (made-up notes, no server)
        run: node scripts/check_bell.mjs

  browser2:
    name: Browser checks (2 of 3)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      # --with-deps needs administrator rights. On GitHub's machines that is automatic; on your own machine install the libraries once yourself.
      - run: npx playwright install ${{ vars.RUNNER_LABELS == '' && '--with-deps' || '' }} chromium
      - name: A label on each email says which mailbox it came from when there are several (made-up mail, no server)
        run: node scripts/check_mailbox_label.mjs
      - name: Browser check of the Mailboxes page and its Edit page
        run: node scripts/check_mailboxes_page.mjs
      - name: The inbox list stays where it was scrolled to when the page refreshes (made-up mail, no server)
