name: Replace Northern Coast artwork with supplied photographs
on:
  push:
    branches:
      - feature/northern-coast-inbox-preview
    paths:
      - .github/workflows/replace-coast-user-images.yml
permissions:
  contents: write
jobs:
  replace-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original Pexels photographs and crop for desktop header
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          source = {
              "light": ("https://images.pexels.com/photos/14658753/pexels-photo-14658753.jpeg", 430, "14658753"),
              "dark": ("https://images.pexels.com/photos/6663553/pexels-photo-6663553.jpeg", 440, "6663553"),
          }
          for theme, (url, vertical_start, expected_id) in source.items():
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(request, timeout=90) as response:
                  payload = response.read()
              with Image.open(BytesIO(payload)) as img:
                  img.load()
                  img = img.convert("RGB")
                  width, height = img.size
                  # The user supplied photographs were displayed at 2048px
                  # wide. Preserve the reviewed header crop proportionally.
                  crop_height = round(width * 387 / 2048)
                  crop_top = round(vertical_start * height / 1366)
                  crop_top = min(max(0, crop_top), height - crop_height)
                  banner = img.crop((0, crop_top, width, crop_top + crop_height))
                  banner = banner.resize((4500, 850), Image.Resampling.LANCZOS)
                  target = Path("web/static") / f"northern-coast-{theme}.webp"
                  banner.save(target, "WEBP", quality=92, method=6)
                  with Image.open(target) as verify:
                      assert verify.size == (4500, 850)
                  print(f"{theme}: source {width}x{height} ({len(payload)} bytes), output 4500x850, {target.stat().st_size} bytes")
          PY
      - name: Commit only both image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/static/northern-coast-light.webp web/static/northern-coast-dark.webp
          git diff --cached --quiet && { echo "No image changes"; exit 1; }
          git commit -m "Use supplied Pexels landscapes for Northern Coast themes"
          git push origin HEAD:feature/northern-coast-inbox-preview
