name: Remove Claude mentions

# Manual only: run it from the Actions tab whenever you like.
# It starts as a dry run that only lists what it would remove.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list the lines that would be removed"
        type: boolean
        default: true
      clean_files:
        description: "Also remove mentions from Markdown files in the repo (commits to the default branch)"
        type: boolean
        default: true

jobs:
  github-text:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dry = process.env.DRY_RUN === 'true';
            const MENTION = /claude/i;

            // Drops every line that mentions Claude (this also catches the
            // "Generated by/with Claude Code" footer, claude.ai and claude.com
            // session links and Co-Authored-By trailers), then tidies leftover
            // blank lines and a dangling --- / *** / ___ separator at the end.
            function clean(text) {
              if (!text || !MENTION.test(text)) return null;
              const lines = text.split(/\r?\n/);
              const removed = lines.filter(l => MENTION.test(l));
              let kept = lines.filter(l => !MENTION.test(l)).join('\n');
              kept = kept.replace(/\n{3,}/g, '\n\n');
              kept = kept.replace(/(\n\s*(?:---|\*\*\*|___)\s*)+$/g, '').trimEnd();
              return { text: kept, removed };
            }

            let changed = 0;
            async function apply(label, text, update) {
              const r = clean(text);
              if (!r) return;
              changed++;
              core.info(`${dry ? 'WOULD FIX' : 'FIXING'}: ${label}`);
              for (const l of r.removed) core.info(`    - ${l.trim().slice(0, 160)}`);
              if (dry) return;
              try { await update(r.text); }
              catch (e) { core.warning(`Could not edit ${label}: ${e.message}`); }
            }

            // PR and issue descriptions (open and closed). Titles are only reported.
            const items = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 });
            for (const i of items) {
              const kind = i.pull_request ? 'PR' : 'issue';
              if (MENTION.test(i.title)) {
                core.warning(`${kind} #${i.number} title mentions it and needs a manual edit: ${i.title}`);
              }
              await apply(`${kind} #${i.number} description`, i.body, body =>
                github.rest.issues.update({ owner, repo, issue_number: i.number, body }));
              if (i.pull_request) {
                const reviews = await github.paginate(github.rest.pulls.listReviews,
                  { owner, repo, pull_number: i.number, per_page: 100 });
                for (const r of reviews) {
                  await apply(`PR #${i.number} review ${r.id}`, r.body, body =>
                    github.rest.pulls.updateReview({ owner, repo, pull_number: i.number, review_id: r.id, body }));
                }
              }
            }

            // Issue and PR conversation comments
            const comments = await github.paginate(github.rest.issues.listCommentsForRepo,
              { owner, repo, per_page: 100 });
            for (const c of comments) {
              await apply(`comment ${c.id}`, c.body, body =>
                github.rest.issues.updateComment({ owner, repo, comment_id: c.id, body }));
            }

            // Inline review comments on code
            const rcomments = await github.paginate(github.rest.pulls.listReviewCommentsForRepo,
              { owner, repo, per_page: 100 });
            for (const c of rcomments) {
              await apply(`review comment ${c.id}`, c.body, body =>
                github.rest.pulls.updateReviewComment({ owner, repo, comment_id: c.id, body }));
            }

            // Release notes
            const releases = await github.paginate(github.rest.repos.listReleases,
              { owner, repo, per_page: 100 });
            for (const rel of releases) {
              if (MENTION.test(rel.name || '')) {
                core.warning(`release ${rel.tag_name} name mentions it and needs a manual edit`);
              }
              await apply(`release ${rel.tag_name} notes`, rel.body, body =>
                github.rest.repos.updateRelease({ owner, repo, release_id: rel.id, body }));
            }

            core.info(`${dry ? 'Would change' : 'Changed'} ${changed} item(s).`);

  files:
    if: ${{ inputs.clean_files }}
    needs: github-text
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Remove mentions from Markdown files
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Markdown files only, so program code is never touched (some projects
          # have code that legitimately names AI providers). Files under
          # .github/workflows are skipped because the default token may not edit them.
          files=$(grep -rliI -E 'claude' --include='*.md' \
            --exclude-dir=.git --exclude-dir=workflows --exclude-dir=node_modules . || true)
          if [ -z "$files" ]; then echo "No Markdown files contain a mention."; exit 0; fi
          echo "Files with mentions:"
          echo "$files"
          echo "Lines that would be removed:"
          echo "$files" | xargs grep -niI -E 'claude' | cut -c1-200
          if [ "$DRY_RUN" = "true" ]; then exit 0; fi
          echo "$files" | xargs sed -i -E '/claude/Id'
          git config user.name jlnau
          git config user.email 79790371+jlnau@users.noreply.github.com
          git diff --quiet || { git commit -am "Tidy documentation text" && git push; }
