name: Replace Northern Coast photographs
on:
  push:
    branches:
      - feature/northern-coast-inbox-preview
    paths:
      - .github/workflows/replace-northern-coast-photos.yml
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact photographs and crop high quality banners
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image
          inputs = {
              "light": ("https://images.pexels.com/photos/14658753/pexels-photo-14658753.jpeg", 430),
              "dark": ("https://images.pexels.com/photos/6663553/pexels-photo-6663553.jpeg", 440),
          }
          for mode, (url, y) in inputs.items():
              req = Request(url + "?auto=compress&cs=tinysrgb&w=2048", headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(req, timeout=45) as response:
                  data = response.read()
              with Image.open(BytesIO(data)) as source:
                  image = source.convert("RGB")
              print(mode, "source resolution:", image.size, flush=True)
              if image.width < 2000 or image.height < 1000:
                  raise RuntimeError(f"Unexpected source dimensions for {mode}: {image.size}")
              # Crop based on the user's supplied 2048px photos.
              scale = image.width / 2048
              top = round(y * scale)
              crop_h = round(387 * scale)
              if top + crop_h > image.height:
                  raise RuntimeError("Photo crop exceeds image height")
              result = image.crop((0, top, image.width, top + crop_h))
              result = result.resize((4500,850), Image.Resampling.LANCZOS)
              target = Path("web/static") / f"northern-coast-{mode}.webp"
              result.save(target, "WEBP", quality=92, method=6)
              with Image.open(target) as check:
                  assert check.size == (4500, 850)
              print(mode, target, target.stat().st_size, flush=True)
          PY
      - name: Commit photograph replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/static/northern-coast-dark.webp web/static/northern-coast-light.webp
          git diff --cached --quiet && exit 0
          git commit -m "Replace Northern Coast header assets with original photographs"
          git push origin HEAD:feature/northern-coast-inbox-preview
