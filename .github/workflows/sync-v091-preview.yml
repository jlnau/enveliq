name: Sync v0.91 Test Branch

on:
  push:
    branches:
      - feat/v0.91
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-v091-preview
  cancel-in-progress: false

jobs:
  sync:
    name: Update preview branch and build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.91
          fetch-depth: 0

      - name: Synchronise preview without overwriting unrelated work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/feat/v0.91 refs/heads/preview/v0.91
          SOURCE="$(git rev-parse FETCH_HEAD)"
          SOURCE="$(git rev-parse refs/remotes/origin/feat/v0.91)"
          TARGET="$(git rev-parse refs/remotes/origin/preview/v0.91)"
          if ! git merge-base --is-ancestor "$TARGET" "$SOURCE"; then
            echo "::error::Preview has commits not present in the PR branch. Refusing to overwrite them."
            exit 1
          fi
          if [ "$SOURCE" != "$TARGET" ]; then
            git push origin "$SOURCE:refs/heads/preview/v0.91"
          fi

      - name: Trigger preview image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-ui-preview.yml --repo "${{ github.repository }}" --ref preview/v0.91
