name: Sync v0.92 Preview Branch

on:
  push:
    branches:
      - feat/v0.92
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-v092-preview
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronise preview and trigger build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.92
          fetch-depth: 0

      - name: Fast forward preview to current feature commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/feat/v0.92:refs/remotes/origin/feat/v0.92 +refs/heads/preview/v0.92:refs/remotes/origin/preview/v0.92
          SOURCE="$(git rev-parse refs/remotes/origin/feat/v0.92)"
          TARGET="$(git rev-parse refs/remotes/origin/preview/v0.92)"
          if ! git merge-base --is-ancestor "$TARGET" "$SOURCE"; then
            echo "::error::Preview has divergent commits. Refusing to discard them."
            exit 1
          fi
          if [ "$SOURCE" != "$TARGET" ]; then
            git push origin "$SOURCE:refs/heads/preview/v0.92"
          fi

      - name: Build exact preview revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-ui-preview.yml --repo "${{ github.repository }}" --ref preview/v0.92
