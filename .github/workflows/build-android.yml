# Builds the Enveliq Android app and attaches the installable file (an APK) to the run, under "Artifacts".
# When you publish a GitHub Release, the same build is also attached to that release as Enveliq-<tag>.apk (with its checksum).
# The official app is signed with one permanent release key, kept in the four ANDROID_ repository secrets. Every version then
# installs over the last one, and passkeys on the phone can trust it (docs/ANDROID.md). A release of the official repository
# is refused when those secrets are missing, so a throwaway key can never be published.
# Anyone building their own copy without the secrets gets a temporary key kept in GitHub's cache: fine for trying the app, but updates
# may need an uninstall first.
name: Build Android app

on:
  push:
    branches:
      - "preview/**"
      - "main"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  schedule:
    - cron: "23 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a release you publish

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  key:
    name: Keep the app's signing key
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find the saved key, or make it the first time
        id: saved
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enveliq-android-debug-keystore
      - name: Make the key
        if: ${{ steps.saved.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

  apk:
    name: Build the APK
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Work out the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(echo "$GITHUB_REF_NAME" | sed -n 's#^preview/v\(.*\)$#\1-preview#p')"
            [ -z "$V" ] && V="dev"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=your own release key" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$GITHUB_REPOSITORY" = "jlnau/enveliq" ]; then
              echo "::error::The official app must be signed with the permanent release key. Add the four ANDROID_ secrets (docs/ANDROID.md, Signing) and publish again."
              exit 1
            fi
            echo "::warning::No release key set: this build uses a temporary key, so it may not install over an earlier version."
            echo "SIGNING=a temporary key (not for release)" >> "$GITHUB_ENV"
          fi
      - name: Use the saved key, so this build installs over the last one
        if: ${{ env.ANDROID_KEYSTORE_PATH == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enveliq-android-debug-keystore
      - name: Add the Google push file (when the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "PUSH=Google push is included" >> "$GITHUB_ENV"
          else
            echo "PUSH=Google push is not included (add the GOOGLE_SERVICES_JSON secret)" >> "$GITHUB_ENV"
          fi
      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the app
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleRelease -PappVersion="$APP_VERSION" -PappCode="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -20 | while read -r line; do echo "::error::${line:0:400}"; done
            grep -E -A3 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -12 | while read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $status
      - name: Name the file and check its signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk"
          cd "$RUNNER_TEMP"
          sha256sum "Enveliq-${APP_VERSION}.apk" > "Enveliq-${APP_VERSION}.apk.sha256"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "Enveliq-${APP_VERSION}.apk")"
          echo "$CERTS" | head -3
          FP="$(echo "$CERTS" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//')"
          echo "::notice title=Signing fingerprint (SHA-256)::${FP} (${SIGNING})"
          {
            echo "### Enveliq for Android ${APP_VERSION}"
            echo "Signed with ${SIGNING}. ${PUSH}."
            echo '```'
            cat "Enveliq-${APP_VERSION}.apk.sha256"
            echo '```'
            echo "Signing certificate (for locking the Firebase API key to this app; these are public):"
            echo '```'
            echo "$CERTS" | grep -i 'digest' | grep -v -i 'md5' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Enveliq-android-apk
          path: |
            ${{ runner.temp }}/Enveliq-${{ env.APP_VERSION }}.apk
            ${{ runner.temp }}/Enveliq-${{ env.APP_VERSION }}.apk.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Attach the app to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk" "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk.sha256" --clobber
