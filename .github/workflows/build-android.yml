# Builds the Enveliq Android app and attaches the installable file (an APK) to the run, under "Artifacts".
# When you publish a GitHub Release, the same build is also attached to that release as Enveliq-<tag>.apk (with its checksum).
# The app is signed with your own release key when the four ANDROID_ secrets exist (docs/ANDROID.md says how to make them).
# Without them it is still built, signed with a temporary debug key, so it can be tried but is not a proper release.
name: Build Android app

on:
  push:
    branches:
      - "preview/**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a release you publish

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Work out the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(echo "$GITHUB_REF_NAME" | sed -n 's#^preview/v\(.*\)$#\1-preview#p')"
            [ -z "$V" ] && V="dev"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=your release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=a temporary debug key (add the ANDROID_ secrets for a proper release)" >> "$GITHUB_ENV"
          fi
      - name: Keep the same debug key between builds, when there is no release key
        if: ${{ env.ANDROID_KEYSTORE_PATH == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enveliq-android-debug-keystore
      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the app
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleRelease -PappVersion="$APP_VERSION" -PappCode="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -20 | while read -r line; do echo "::error::${line:0:400}"; done
            grep -E -A3 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -12 | while read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $status
      - name: Name the file and check its signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk"
          cd "$RUNNER_TEMP"
          sha256sum "Enveliq-${APP_VERSION}.apk" > "Enveliq-${APP_VERSION}.apk.sha256"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "Enveliq-${APP_VERSION}.apk" | head -3
          {
            echo "### Enveliq for Android ${APP_VERSION}"
            echo "Signed with ${SIGNING}."
            echo '```'
            cat "Enveliq-${APP_VERSION}.apk.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Enveliq-android-apk
          path: |
            ${{ runner.temp }}/Enveliq-${{ env.APP_VERSION }}.apk
            ${{ runner.temp }}/Enveliq-${{ env.APP_VERSION }}.apk.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Attach the app to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk" "$RUNNER_TEMP/Enveliq-${APP_VERSION}.apk.sha256" --clobber
