# Builds the Enveliq Android demo app and attaches the installable file (an APK) to the run, under "Artifacts".
# It is signed with a debug key, so it is for trying the app on your own phone, not for sharing or for any app store.
name: Build Android demo

on:
  push:
    branches:
      - "preview/**"
    paths:
      - "android/**"
      - ".github/workflows/build-android-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Keep the same signing key between builds, so a new build installs over the old one
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enveliq-android-demo-debug-keystore
      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the demo app
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -20 | while read -r line; do echo "::error::${line:0:400}"; done
            grep -E -A3 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -12 | while read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $status
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Enveliq-demo.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Enveliq-demo-apk
          path: ${{ runner.temp }}/Enveliq-demo.apk
          retention-days: 14
          if-no-files-found: error
