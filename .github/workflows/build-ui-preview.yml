name: Build UI Preview
# Experiment uses an isolated image tag to avoid overwriting the v0.91 preview.
on:
  push:
    branches:
      - "preview/**"
      - feature/ui-preview-calm-default
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish isolated preview images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/jlnau/enveliq
            dockerfile: Dockerfile
          - image: ghcr.io/jlnau/enveliq-render
            dockerfile: Dockerfile.render
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ github.ref_name == 'preview/reading-calendar' && 'ui-reading-calendar' || 'ui-preview' }}
          platforms: linux/amd64
