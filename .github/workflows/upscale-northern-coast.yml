name: Improve Northern Coast image resolution
on:
  push:
    branches:
      - feature/northern-coast-inbox-preview
    paths:
      - .github/workflows/upscale-northern-coast.yml
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enlarge existing artwork without changing composition
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          for mode in ("dark", "light"):
              path = Path("web/static") / f"northern-coast-{mode}.webp"
              with Image.open(path) as im:
                  im.load()
                  print(f"Source {mode}: {im.width} x {im.height}")
                  if im.width >= 4000:
                      continue
                  # Image fidelity takes priority: preserve the original crop,
                  # scene, colours, and exact composition.
                  output = im.convert("RGB").resize((im.width*5, im.height*5), Image.Resampling.LANCZOS)
                  output = output.filter(ImageFilter.UnsharpMask(radius=1.3, percent=115, threshold=3))
                  output.save(path, "WEBP", quality=94, method=6)
                  with Image.open(path) as verify:
                      assert verify.size == (4500, 850), (mode, verify.size)
                      print(f"Updated {mode}: {verify.width} x {verify.height}; {path.stat().st_size} bytes")
          PY
      - name: Commit upgraded artwork onto the draft branch
        run: |
          if git diff --quiet -- web/static/northern-coast-dark.webp web/static/northern-coast-light.webp; then
            echo "No asset changes necessary"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/static/northern-coast-dark.webp web/static/northern-coast-light.webp
          git commit -m "Increase Northern Coast image resolution while preserving artwork"
          git push origin HEAD:feature/northern-coast-inbox-preview
